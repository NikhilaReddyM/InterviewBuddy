<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#4d716b" stroke-width="1.6"/></marker></defs><rect width="1500" height="1140" fill="#f4f8f7"/><style>text{font-family:Arial,sans-serif;fill:#193e36}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#51716a}.heading{font-size:21px;font-weight:700}.line{font-size:16px}.small{font-size:14px;fill:#51716a}.wire{fill:none;stroke:#4d716b;stroke-width:2;marker-end:url(#arrow)}</style><text x="60" y="48" class="title">InterviewBuddy · Job Application Copilot</text><text x="60" y="76" class="sub">Local model reasoning, persistent state, browser preparation and final human submission</text><rect x="60" y="110" width="320" height="120" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="80" y="144" class="heading">React interface</text><text x="80" y="174" class="line">Confirmed resume and preferences</text><text x="80" y="197" class="line">Review queue and saved work</text><rect x="470" y="110" width="420" height="120" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="490" y="144" class="heading">FastAPI backend</text><text x="490" y="174" class="line">Manual or scheduled discovery</text><text x="490" y="197" class="line">Explicit tool integrations</text><rect x="1050" y="110" width="390" height="120" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="1070" y="144" class="heading">SQLite persistent records</text><text x="1070" y="174" class="line">Profiles, jobs, drafts and findings</text><text x="1070" y="197" class="line">Forms, reminders and schedules</text><path d="M380 170 H470" class="wire"/><path d="M890 170 H1050" class="wire"/><rect x="60" y="300" width="320" height="120" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="80" y="334" class="heading">Public job sources</text><text x="80" y="364" class="line">Remotive and Arbeitnow</text><text x="80" y="387" class="line">Selected Greenhouse / Ashby boards</text><rect x="470" y="280" width="420" height="160" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="490" y="314" class="heading">Discovery reasoning</text><text x="490" y="344" class="line">Planner chooses keywords</text><text x="490" y="367" class="line">Shortlist and match jobs to facts</text><text x="490" y="390" class="line">Save scores, reasons and gaps</text><rect x="1050" y="300" width="390" height="120" rx="14" fill="#e5f2ed" stroke="#c7d9d4"/><text x="1070" y="334" class="heading">Drafting gate: score ≥ 70</text><text x="1070" y="364" class="line">Select within application run limit</text><text x="1070" y="387" class="line">No later suitability reassessment</text><path d="M680 230 V280" class="wire"/><path d="M380 360 H470" class="wire"/><path d="M890 360 H1050" class="wire"/><rect x="60" y="500" width="320" height="120" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="80" y="534" class="heading">LangGraph checkpoints</text><text x="80" y="564" class="line">Core graph progress persists</text><text x="80" y="587" class="line">Resume unfinished steps manually</text><rect x="470" y="490" width="970" height="205" rx="14" fill="#fff" stroke="#c7d9d4"/><text x="490" y="525" class="heading">Application graph · Specialist model roles</text><rect x="495" y="548" width="260" height="52" rx="9" fill="#e5f2ed"/><text x="520" y="582" class="heading">Analyst</text><rect x="800" y="548" width="260" height="52" rx="9" fill="#e5f2ed"/><text x="825" y="582" class="heading">Writer</text><rect x="1110" y="548" width="260" height="52" rx="9" fill="#e5f2ed"/><text x="1135" y="582" class="heading">Reviewer</text><path d="M755 574 H800" class="wire"/><path d="M1060 574 H1110" class="wire"/><text x="490" y="630" class="line">Coordinator routes writing, revision and completion; up to three Writer passes.</text><text x="490" y="660" class="small">Reviewer feedback loops to Writer. Unresolved blocking findings become needs review.</text><path d="M1245 420 V490" class="wire"/><path d="M470 590 H380" class="wire" stroke-dasharray="6 6"/><rect x="60" y="760" width="320" height="120" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="80" y="794" class="heading">Reminders and email</text><text x="80" y="824" class="line">Saved review reminders</text><text x="80" y="847" class="line">Optional SMTP digest → app link</text><rect x="470" y="755" width="420" height="140" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="490" y="789" class="heading">Employer form preparation</text><text x="490" y="819" class="line">Read actual Greenhouse fields</text><text x="490" y="842" class="line">Map contacts and reviewed answers</text><text x="490" y="865" class="line">Persist values + attachment reference</text><rect x="1050" y="755" width="390" height="140" rx="14" fill="#ffffff" stroke="#c7d9d4"/><text x="1070" y="789" class="heading">Playwright browser worker</text><text x="1070" y="819" class="line">Save employer draft if verified</text><text x="1070" y="842" class="line">Otherwise restore the local plan</text><text x="1070" y="865" class="line">Exact job / Greenhouse iframe</text><path d="M680 695 V755" class="wire"/><path d="M890 820 H1050" class="wire"/><path d="M470 820 H380" class="wire"/><rect x="470" y="970" width="420" height="115" rx="14" fill="#e5f2ed" stroke="#c7d9d4"/><text x="490" y="1004" class="heading">Configured model provider</text><text x="490" y="1034" class="line">Ollama + local Qwen, or Groq</text><text x="490" y="1057" class="line">Same model, separate specialist calls</text><rect x="1050" y="970" width="390" height="115" rx="14" fill="#e5f2ed" stroke="#c7d9d4"/><text x="1070" y="1004" class="heading">Human review and submission</text><text x="1070" y="1034" class="line">Check fields and unknown answers</text><text x="1070" y="1057" class="line">Candidate clicks Submit</text><path d="M1245 895 V970" class="wire"/><path d="M680 970 V895" class="wire" stroke-dasharray="6 6"/><text x="60" y="1020" class="line">Application data is saved locally.</text><text x="60" y="1046" class="small">Browser filling can send data to employers.</text><text x="60" y="1072" class="small">No automatic application submission.</text></svg>