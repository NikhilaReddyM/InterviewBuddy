<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1490" viewBox="0 0 1500 1490"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536f68" stroke-width="1.6"/></marker></defs><rect width="1500" height="1490" fill="#f7faf9"/><style>text{font-family:Arial,sans-serif;fill:#243f37}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526c62}.section{font-size:16px;font-weight:700;letter-spacing:1px}.tag{font-size:13px;font-weight:700;letter-spacing:1px}.heading{font-size:22px;font-weight:700}.line{font-size:17px}.small{font-size:15px;fill:#526c62}.wire{fill:none;stroke:#536f68;stroke-width:2;marker-end:url(#arrow)}</style><text x="50" y="44" class="title">InterviewBuddy · Agents, workflow code and tools</text><text x="50" y="74" class="sub">Six AI agent roles · shared Ollama/Qwen or explicitly selected Groq · final submission by the candidate</text><rect x="50" y="100" width="15" height="15" rx="3" fill="#e3f3e9" stroke="#287551"/><text x="74" y="113" class="small">AGENT · Model role</text><rect x="360" y="100" width="15" height="15" rx="3" fill="#eef5ff" stroke="#6f92be"/><text x="384" y="113" class="small">TOOL · Integration</text><rect x="660" y="100" width="15" height="15" rx="3" fill="#f1f4f5" stroke="#98a8ae"/><text x="684" y="113" class="small">CODE · Workflow rule</text><rect x="1010" y="100" width="15" height="15" rx="3" fill="#f2edfa" stroke="#9c87b9"/><text x="1034" y="113" class="small">STATE · Persistent data</text><rect x="50" y="155" width="300" height="120" rx="12" fill="#f1f4f5" stroke="#98a8ae" stroke-width="1"/><text x="68" y="180" class="tag" style="fill:#2b4048">USER INTERFACE</text><text x="68" y="209" class="heading" style="fill:#2b4048">React web app</text><text x="68" y="237" class="line" style="fill:#2b4048">Confirm profile + new facts</text><text x="68" y="260" class="line" style="fill:#2b4048">Start runs and review results</text><rect x="440" y="155" width="430" height="120" rx="12" fill="#f1f4f5" stroke="#98a8ae" stroke-width="1"/><text x="458" y="180" class="tag" style="fill:#2b4048">CODE · ORCHESTRATION</text><text x="458" y="209" class="heading" style="fill:#2b4048">FastAPI backend</text><text x="458" y="237" class="line" style="fill:#2b4048">Manual or enabled scheduled runs</text><text x="458" y="260" class="line" style="fill:#2b4048">Setup, integrations and recovery</text><rect x="1050" y="155" width="400" height="120" rx="12" fill="#f2edfa" stroke="#9c87b9" stroke-width="1"/><text x="1068" y="180" class="tag" style="fill:#47365c">STATE</text><text x="1068" y="209" class="heading" style="fill:#47365c">SQLite + local files</text><text x="1068" y="237" class="line" style="fill:#47365c">Profile versions, drafts and forms</text><text x="1068" y="260" class="line" style="fill:#47365c">Checkpoints, reminders and cookies</text><path d="M350 215 H440" class="wire"/><path d="M870 215 H1050" class="wire"/><rect x="50" y="320" width="1400" height="235" rx="16" fill="#fff" stroke="#d9e4df"/><text x="75" y="349" class="section">DISCOVERY · model roles and explicit Python tools</text><rect x="75" y="370" width="300" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="93" y="395" class="tag" style="fill:#153f2c">AGENT 1</text><text x="93" y="424" class="heading" style="fill:#153f2c">Search Planner Agent</text><text x="93" y="452" class="line" style="fill:#153f2c">Choose keywords from profile</text><text x="93" y="475" class="line" style="fill:#153f2c">and confirmed preferences</text><rect x="430" y="370" width="350" height="125" rx="12" fill="#eef5ff" stroke="#6f92be" stroke-width="1"/><text x="448" y="395" class="tag" style="fill:#213f63">TOOL + CODE</text><text x="448" y="424" class="heading" style="fill:#213f63">Public job readers</text><text x="448" y="452" class="line" style="fill:#213f63">Fetch listings; normalize,</text><text x="448" y="475" class="line" style="fill:#213f63">deduplicate and shortlist</text><rect x="835" y="370" width="300" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="853" y="395" class="tag" style="fill:#153f2c">AGENT 2</text><text x="853" y="424" class="heading" style="fill:#153f2c">Job Matcher Agent</text><text x="853" y="452" class="line" style="fill:#153f2c">Score relevance; explain</text><text x="853" y="475" class="line" style="fill:#153f2c">supporting facts and gaps</text><rect x="1190" y="370" width="235" height="125" rx="12" fill="#f1f4f5" stroke="#98a8ae" stroke-width="1"/><text x="1208" y="395" class="tag" style="fill:#2b4048">CODE RULE</text><text x="1208" y="424" class="heading" style="fill:#2b4048">Score ≥ 70</text><text x="1208" y="452" class="line" style="fill:#2b4048">Select within the</text><text x="1208" y="475" class="line" style="fill:#2b4048">application run limit</text><path d="M650 275 V300 H60 V433 H75" class="wire"/><path d="M375 433 H430" class="wire"/><path d="M780 433 H835" class="wire"/><path d="M1135 433 H1190" class="wire"/><text x="75" y="530" class="small">Selected jobs proceed to drafting. Below-threshold decisions remain in saved history.</text><path d="M1307 495 V588 H60 V723 H75" class="wire"/><rect x="50" y="615" width="1400" height="305" rx="16" fill="#fff" stroke="#d9e4df"/><text x="75" y="644" class="section">APPLICATION GRAPH · LangGraph checkpoints preserve unfinished steps</text><rect x="75" y="660" width="300" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="93" y="685" class="tag" style="fill:#153f2c">AGENT 3</text><text x="93" y="714" class="heading" style="fill:#153f2c">Analyst Agent</text><text x="93" y="742" class="line" style="fill:#153f2c">Map job requirements</text><text x="93" y="765" class="line" style="fill:#153f2c">to confirmed candidate facts</text><rect x="430" y="660" width="250" height="125" rx="12" fill="#f1f4f5" stroke="#98a8ae" stroke-width="1"/><text x="448" y="685" class="tag" style="fill:#2b4048">CODE · COORDINATOR</text><text x="448" y="714" class="heading" style="fill:#2b4048">Route next step</text><text x="448" y="742" class="line" style="fill:#2b4048">Write, revise or finish;</text><text x="448" y="765" class="line" style="fill:#2b4048">no second fit decision</text><rect x="740" y="660" width="300" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="758" y="685" class="tag" style="fill:#153f2c">AGENT 4</text><text x="758" y="714" class="heading" style="fill:#153f2c">Writer Agent</text><text x="758" y="742" class="line" style="fill:#153f2c">Cover letter, resume ideas</text><text x="758" y="765" class="line" style="fill:#153f2c">and screening answers</text><rect x="1100" y="660" width="325" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="1118" y="685" class="tag" style="fill:#153f2c">AGENT 5</text><text x="1118" y="714" class="heading" style="fill:#153f2c">Reviewer Agent</text><text x="1118" y="742" class="line" style="fill:#153f2c">Check factual support</text><text x="1118" y="765" class="line" style="fill:#153f2c">and completeness</text><path d="M375 723 H430" class="wire"/><path d="M680 723 H740" class="wire"/><path d="M1040 723 H1100" class="wire"/><path d="M1262 785 V865 H555 V785" class="wire"/><text x="680" y="846" class="small">Blocking findings → revise; maximum three Writer passes.</text><text x="75" y="895" class="small">Persist drafts and findings; unresolved blocking issues are marked needs review, not silently approved.</text><path d="M1385 785 V956 H60 V1098 H75" class="wire"/><rect x="50" y="985" width="1400" height="220" rx="16" fill="#fff" stroke="#d9e4df"/><text x="75" y="1014" class="section">EMPLOYER-FORM PREPARATION · additional agent calls run when supported questions need answers</text><rect x="75" y="1035" width="300" height="125" rx="12" fill="#eef5ff" stroke="#6f92be" stroke-width="1"/><text x="93" y="1060" class="tag" style="fill:#213f63">TOOL</text><text x="93" y="1089" class="heading" style="fill:#213f63">Greenhouse reader</text><text x="93" y="1117" class="line" style="fill:#213f63">Read actual form fields</text><text x="93" y="1140" class="line" style="fill:#213f63">and available answer choices</text><rect x="430" y="1035" width="300" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="448" y="1060" class="tag" style="fill:#153f2c">AGENT 6</text><text x="448" y="1089" class="heading" style="fill:#153f2c">Form Answer Agent</text><text x="448" y="1117" class="line" style="fill:#153f2c">Draft answers grounded</text><text x="448" y="1140" class="line" style="fill:#153f2c">in confirmed candidate facts</text><rect x="790" y="1035" width="300" height="125" rx="12" fill="#e3f3e9" stroke="#287551" stroke-width="2"/><text x="808" y="1060" class="tag" style="fill:#153f2c">AGENT 5 · REUSED</text><text x="808" y="1089" class="heading" style="fill:#153f2c">Reviewer Agent</text><text x="808" y="1117" class="line" style="fill:#153f2c">Check generated answers;</text><text x="808" y="1140" class="line" style="fill:#153f2c">leave unknowns blank</text><rect x="1150" y="1035" width="275" height="125" rx="12" fill="#eef5ff" stroke="#6f92be" stroke-width="1"/><text x="1168" y="1060" class="tag" style="fill:#213f63">TOOL</text><text x="1168" y="1089" class="heading" style="fill:#213f63">Playwright worker</text><text x="1168" y="1117" class="line" style="fill:#213f63">Fill supported fields</text><text x="1168" y="1140" class="line" style="fill:#213f63">and attach the resume</text><path d="M375 1098 H430" class="wire"/><path d="M730 1098 H790" class="wire"/><path d="M1090 1098 H1150" class="wire"/><rect x="50" y="1280" width="420" height="125" rx="12" fill="#f1f4f5" stroke="#98a8ae" stroke-width="1"/><text x="68" y="1305" class="tag" style="fill:#2b4048">CODE + SMTP TOOL</text><text x="68" y="1334" class="heading" style="fill:#2b4048">Results and reminders</text><text x="68" y="1362" class="line" style="fill:#2b4048">Manual-run results email, if enabled</text><text x="68" y="1385" class="line" style="fill:#2b4048">Scheduled review digest at its own time</text><rect x="535" y="1280" width="430" height="125" rx="12" fill="#f2edfa" stroke="#9c87b9" stroke-width="1"/><text x="553" y="1305" class="tag" style="fill:#47365c">STATE</text><text x="553" y="1334" class="heading" style="fill:#47365c">Persistent application plan</text><text x="553" y="1362" class="line" style="fill:#47365c">Restore locally saved fields later;</text><text x="553" y="1385" class="line" style="fill:#47365c">record employer draft only if verified</text><rect x="1050" y="1280" width="400" height="125" rx="12" fill="#fff4df" stroke="#bc9753" stroke-width="1"/><text x="1068" y="1305" class="tag" style="fill:#654a1c">HUMAN HANDOFF</text><text x="1068" y="1334" class="heading" style="fill:#654a1c">Candidate review + Submit</text><text x="1068" y="1362" class="line" style="fill:#654a1c">Check unknowns and declarations</text><text x="1068" y="1385" class="line" style="fill:#654a1c">No automatic application submission</text><path d="M940 1160 V1238 H750 V1280" class="wire"/><path d="M965 1343 H1050" class="wire"/><path d="M1287 1160 V1280" class="wire"/><path d="M50 730 H25 V1343 H50" class="wire" stroke-dasharray="6 5"/><text x="50" y="1452" class="small">Green = agent role. Coordinator, threshold, scheduling and persistence are code; browsers and SMTP are tools.</text><text x="50" y="1477" class="small">The six roles share the configured model; they are not six independently hosted models or permanently learning agents.</text></svg>